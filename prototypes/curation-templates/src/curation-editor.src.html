<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecta, Edit curation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Serif+Display&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
<style>
:root{
  --ink:#14171C;--mute:#5B616B;--faint:#8A8F98;--fill:#F1F2F4;--fill2:#E7E9ED;
  --serif:'Instrument Serif','MaruBuri','Noto Serif KR',serif;
  --kr:'MaruBuri','Noto Serif KR',serif;
  --sans:'SUIT Variable','SUIT',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --brand:'DM Serif Display',serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --bar:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
ol,ul{list-style:none}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.lnk{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:10px 20px;background:var(--ink);color:#fff;font-weight:500;font-size:14px;transition:opacity .2s}
.btn:hover{opacity:.86}.btn.ghost{background:var(--fill);color:var(--ink)}

/* bar */
.bar{height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px}
.bar .l{display:flex;align-items:baseline;gap:22px;min-width:0}
.brand{font:400 30px/1 var(--brand)}
.crumb{font-size:14px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{font-weight:400;color:var(--ink)}
.acts{display:flex;align-items:center;gap:20px;font-size:14px}
.acts .msg{color:var(--faint);font-variant-numeric:tabular-nums}

/* three panes */
.ws{display:grid;grid-template-columns:288px minmax(0,1fr) 392px;height:calc(100svh - var(--bar));min-height:0}
.rail,.insp{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--fill2) transparent}
.rail{padding:6px 12px 24px 18px}
.insp{padding:6px 24px 60px 8px}
.h{font:400 13px/1 var(--sans);color:var(--faint);margin:22px 0 12px}

/* page rail */
.pg{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:8px 8px 8px 6px;border-radius:14px;cursor:pointer;transition:background .2s,color .2s}
.pg:hover{background:var(--fill)}
.pg.on{background:var(--ink);color:#fff}
.pg .n{font:400 12px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--faint)}
.pg.on .n{color:rgba(255,255,255,.6)}
.pg .th{width:40px;aspect-ratio:3/4;overflow:hidden;background:var(--fill2);display:grid;place-items:center}
.pg .th img{width:100%;height:100%;object-fit:cover;display:block}
.pg .th.ct{background:transparent;font:400 17px/1 var(--brand);color:inherit}
.pg .tt{min-width:0}
.pg .tt b{display:block;font:italic 400 19px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .tt b.hk{font:300 15px/1.25 var(--kr);letter-spacing:-.02em}
.pg .tt small{display:block;margin-top:3px;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.on .tt small{color:rgba(255,255,255,.62)}
.pg .rt{display:none;gap:2px}
.pg:hover .rt,.pg.on .rt{display:flex}
.sm{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.sm:hover{background:rgba(127,127,127,.22)}
.sm[disabled]{opacity:.3;cursor:default}
.sm svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.addw{margin-top:8px;display:flex;align-items:center;gap:12px;padding:10px 8px;font-size:14px;width:100%;border-radius:14px;color:var(--mute)}
.addw:hover{background:var(--fill)}
.addw i{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-style:normal;font-size:20px;color:var(--ink)}

/* stage */
.stage-w{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 8px 16px}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 14px;font-size:14px;color:var(--mute)}
.sbar .pn{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sbar .pn button{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.sbar .pn button:hover{background:var(--fill2)}
.sbar .pn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sbar .pn span{min-width:7em;text-align:center;color:var(--ink)}
.seg{display:flex;gap:18px}
.seg button{color:var(--faint);padding:2px 0}
.seg button.on{color:var(--ink);text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;background:var(--fill);overflow:hidden}
.stage iframe{position:absolute;border:0;background:#fff;transform-origin:0 0;box-shadow:0 22px 50px -24px rgba(0,0,0,.35)}

/* inspector */
.ph1{font:400 clamp(30px,2.3vw,36px)/1.05 var(--serif);letter-spacing:-.01em;margin:14px 0 6px;overflow-wrap:anywhere}
.ph1.hk{font:300 26px/1.25 var(--kr);letter-spacing:-.03em}
.ph2{font-size:14px;color:var(--mute)}
.field{width:100%;border:0;border-radius:14px;background:var(--fill);padding:12px 16px 13px;font:400 16px/1.4 var(--kr);outline:none}
.field:focus,.area:focus{background:var(--fill2)}
.field::placeholder,.area::placeholder,.title-in::placeholder{color:#A9AEB6}
.area{width:100%;resize:vertical;min-height:120px;border:0;border-radius:16px;background:var(--fill);padding:16px 18px;font:400 15.5px/1.75 var(--kr);outline:none}
.title-in{display:block;width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:0 0 10px;font:400 34px/1.12 var(--serif);letter-spacing:-.015em;outline:none;resize:none;overflow:hidden;height:1.3em}
.title-in.hk{font-family:var(--kr);font-weight:300;letter-spacing:-.04em}
.sub-in{width:100%;margin-top:12px;border:0;background:transparent;font:400 16px/1.5 var(--kr);outline:none;color:var(--mute)}
.sub-in::placeholder{color:#A9AEB6}
.lay{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.lay button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 8px;border-radius:12px;font-size:11.5px;color:var(--mute);transition:background .2s,color .2s}
.lay button svg{width:34px;height:46px;stroke:currentColor;fill:none;stroke-width:1.2}
.lay button svg .f{fill:currentColor;stroke:none}
.lay button:hover{background:var(--fill)}.lay button.on{background:var(--ink);color:#fff}.lay button.off{opacity:.38}
.hint{margin-top:10px;font-size:13px;color:var(--mute);line-height:1.6}
.tb{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.tb button{height:30px;min-width:30px;padding:0 12px;border-radius:99px;background:var(--fill);font-size:12.5px}
.tb button:hover{background:var(--fill2)}
.tb .sp{flex:1}.tb .cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc .t{position:relative;min-width:0}
.sc .im{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;object-fit:cover;background:var(--fill)}
.sc .ctl{position:absolute;top:5px;right:5px;display:flex;gap:3px;opacity:0;transition:opacity .2s}
.sc .t:hover .ctl,.sc .t:focus-within .ctl{opacity:1}
.sc .ctl button{width:22px;height:22px;border-radius:50%;background:rgba(20,23,28,.8);color:#fff;font-size:12px;line-height:1}
.sc .cap-in{width:100%;margin-top:5px;border:0;background:transparent;font:400 12px/1.3 var(--sans);color:var(--mute);outline:none}
.sc .cap-in::placeholder{color:#B3B8BF}
.sc .addtile{aspect-ratio:4/3;border-radius:10px;background:var(--fill);display:grid;place-items:center;font-size:12.5px;color:var(--mute);cursor:pointer;text-align:center;padding:6px;transition:background .2s}
.sc .addtile:hover,.sc .addtile.drag{background:var(--fill2)}
.sc .ghost{opacity:.55}
.switch{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mute);margin-top:22px;cursor:pointer}
.switch input{appearance:none;width:40px;height:23px;border-radius:99px;background:#CDD1D8;position:relative;transition:background .2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch input:checked{background:var(--ink)}.switch input:checked::after{transform:translateX(17px)}
.det{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det .full{grid-column:1/3}
.tpl{display:grid;grid-template-columns:1fr;gap:8px}
.tpl button{display:grid;grid-template-columns:84px 1fr;column-gap:14px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;background:var(--fill);transition:background .2s,color .2s}
.tpl button:hover{background:var(--fill2)}.tpl button.on{background:var(--ink);color:#fff}
.tpl svg{width:84px;height:44px;stroke:currentColor;fill:none;stroke-width:1.2}.tpl svg .f{fill:currentColor;stroke:none}
.tpl b{display:block;font:400 21px/1.1 var(--serif)}.tpl small{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:var(--fill);font-size:13px;transition:background .2s}
.chips button.on{background:var(--ink);color:#fff}
.chips i{width:20px;height:20px;border-radius:50%;flex:none}
.chip-s{font-size:12.5px;color:var(--faint)}
.rm{margin-top:34px;font-size:13px;color:var(--faint)}
.rm button:hover{color:var(--ink)}

/* add dialog and toast */
.veil{position:fixed;inset:0;z-index:50;background:rgba(20,23,28,.34);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.veil.on{opacity:1;visibility:visible}
.sheet{width:min(560px,92vw);max-height:84svh;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.2);padding:26px 26px 22px;display:flex;flex-direction:column;transform:translateY(14px);transition:transform .35s var(--ease)}
.veil.on .sheet{transform:none}
.sheet h3{font:400 30px/1 var(--serif);margin-bottom:16px}
.sheet .res{margin-top:14px;overflow:auto;min-height:120px}
.res li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 0}
.res li .cv{width:44px;aspect-ratio:2/3;display:block;overflow:hidden;background:var(--fill)}
.res li img{width:100%;height:100%;object-fit:cover;display:block}
.res li b{display:block;font:italic 400 19px/1.15 var(--serif)}
.res li b.hk{font:400 16px/1.3 var(--kr)}
.res li small{font-size:13px;color:var(--faint)}
.res .none{padding:20px 0;color:var(--faint);font-size:14.5px;display:block}
.manual{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.manual .full{grid-column:1/3}
.sheet .row{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:99px;padding:12px 22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:60;display:flex;gap:18px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{text-decoration:underline;text-underline-offset:5px;color:#fff;font-size:14px}

@media (max-width:1180px){.ws{grid-template-columns:220px minmax(0,1fr) 340px}.acts .lnk{display:none}}
@media (max-width:900px){body{overflow:auto}.ws{display:block;height:auto}.stage-w{height:70svh}.rail,.insp{overflow:visible;padding:12px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="l"><a class="brand" href="#">Lecta</a><span class="crumb">My rooms <span style="margin:0 8px">/</span> <b id="crumb-t">Untitled</b></span></div>
  <div class="acts"><span class="msg" id="saved">Draft</span><button class="lnk" type="button" data-act="open-full">Open full preview</button><button class="lnk" type="button" data-act="json">Download JSON</button><button class="btn" type="button" data-act="save">Save</button></div></header>

<main class="ws">
  <nav class="rail" id="rail" aria-label="Pages"></nav>
  <section class="stage-w">
    <div class="sbar"><div class="pn"><button type="button" data-act="prev" aria-label="Previous page"><svg viewBox="0 0 14 14"><path d="M9 2L4 7l5 5"/></svg></button><span id="pn-t"></span><button type="button" data-act="next" aria-label="Next page"><svg viewBox="0 0 14 14"><path d="M5 2l5 5-5 5"/></svg></button></div>
      <div class="seg" id="seg"><button type="button" data-mode="desktop" class="on">Desktop</button><button type="button" data-mode="mobile">Mobile</button></div></div>
    <div class="stage" id="stage"><iframe id="frame" title="Curation preview"></iframe></div>
  </section>
  <aside class="insp" id="insp" aria-label="Page settings"></aside>
</main>

<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Add a work">
  <h3>Add a work</h3>
  <input class="field" id="q" type="search" placeholder="제목이나 만든 사람으로 찾기" autocomplete="off">
  <ul class="res" id="res"></ul>
  <div class="manual" id="manual" hidden>
    <input class="field full" data-m="title" placeholder="제목">
    <input class="field" data-m="creator" placeholder="만든 사람">
    <input class="field" data-m="year" placeholder="연도" inputmode="numeric">
    <select class="field" data-m="medium"><option value="film">영화</option><option value="series">시리즈</option><option value="book">책</option><option value="album">앨범</option></select>
    <label class="field" style="cursor:pointer;color:var(--mute)">표지 이미지 올리기<input type="file" accept="image/*" data-m-file hidden></label>
    <span class="full chip-s" id="m-file-name"></span>
  </div>
  <div class="row"><button class="lnk" type="button" data-act="manual">Add by hand</button><span style="display:flex;gap:12px"><button class="btn ghost" type="button" data-act="close-add">Close</button><button class="btn" type="button" data-act="add-manual" id="add-manual" hidden>Add</button></span></div>
</div></div>
<div class="toast" id="toast"><span id="toast-t"></span><button type="button" id="toast-u" hidden>Undo</button></div>

<script>
/*@samples*/
</script>

    var list = CATALOG.filter(function (c) { return have.indexOf(c.title + '|' + c.creator) < 0 && (!q || (c.title + ' ' + c.creator).toLowerCase().indexOf(q) > -1); }).slice(0, 30);
    $('#res').innerHTML = list.length ? list.map(function (c) {
      return '<li data-c="' + CATALOG.indexOf(c) + '"><span class="cv"><img src="' + esc(artSrc(c.art, c.title, c.creator)) + '" alt=""></span><span><b class="' + hk(c.title) + '">' + esc(c.title) + '</b><small>' + esc(MEDIUM[c.medium] || '') + ' / ' + esc(c.creator) + ', ' + esc(c.year) + '</small></span><button class="btn ghost" type="button" data-pick>Add</button></li>';
    }).join('') : '<li class="none">찾는 작품이 없어요. 아래 Add by hand로 직접 담을 수 있어요.</li>';
  }
  $('#res').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pick]'); if (!b) return;
    var c = CATALOG[+b.closest('li').getAttribute('data-c')], nw = newWork({ title: c.title, creator: c.creator, year: String(c.year || ''), medium: c.medium, art: c.art });
    S.works.push(nw); S.sel = nw.uid; S.focusPending = true; closeAdd(); renderAll(); toast('Added ' + c.title);
  });
  function addManual() {
    var v = {}; [].forEach.call($('#manual').querySelectorAll('[data-m]'), function (el) { v[el.getAttribute('data-m')] = el.value.trim(); });
    if (!v.title) { toast('제목을 적어 주세요'); return; }
    var mk = function (cover) {
      var nw = newWork({ title: v.title, creator: v.creator, year: v.year, medium: v.medium, cover: cover ? { src: cover.src } : null, ar: cover ? cover.ar : 0.667 });
      S.works.push(nw); S.sel = nw.uid; S.focusPending = true; closeAdd();
      [].forEach.call($('#manual').querySelectorAll('[data-m]'), function (el) { if (el.tagName !== 'SELECT') el.value = ''; }); manualFile = null; $('#m-file-name').textContent = ''; renderAll();
    };
    if (manualFile) readImage(manualFile, 900).then(mk); else mk(null);
  }

  /* ---------- save and export ---------- */
  var KEY = 'lecta.curation.draft.v2';
  function autosave() { clearTimeout(saveTimer); $('#saved').textContent = 'Editing'; saveTimer = setTimeout(function () { save(false); }, 900); }
  function save(manual) {
    var d = window.LectaEditor.getData(), ok = true;
    d.focus = null;
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (err) {
      try { d.items.forEach(function (it) { it.scenes = []; if (it.cover && /^data:/.test(it.cover.src)) it.cover = null; }); localStorage.setItem(KEY, JSON.stringify(d)); ok = 'partial'; } catch (e2) { ok = false; }
    }
    if (manual && typeof window.LectaEditor.onSave === 'function') window.LectaEditor.onSave(window.LectaEditor.getData());
    var t = new Date(), hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    $('#saved').textContent = ok === true ? 'Saved ' + hh : ok ? 'Saved without images ' + hh : 'Not saved';
    if (manual) toast(ok === true ? 'Saved' : ok ? '이미지가 커서 글만 저장했어요' : '저장 공간이 부족해요');
  }
  function downloadJson() {
    var d = window.LectaEditor.getData(); d.focus = null;
    var blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (S.title || 'curation').replace(/[^\wㄱ-힣]+/g, '-') + '.json'; document.body.appendChild(a); a.click(); a.remove();
  }
  function openFull() {
    var w = window.open(S.template + '.html?feed=1', '_blank'); if (!w) { toast('팝업이 막혀 있어요'); return; }
    var h = function (e) { if (e.source === w && e.data && e.data.type === 'lecta:ready') { var d = curation(); d.focus = null; w.postMessage({ type: 'lecta:curation', data: d }, '*'); window.removeEventListener('message', h); } };
    window.addEventListener('message', h);
  }
  function load(d) {
    S.title = d.title || ''; S.subtitle = d.subtitle || ''; S.intro = d.intro || ''; S.curator = d.curator || ''; S.accent = d.accentIndex != null ? d.accentIndex : null;
    if (d.template && TEMPLATES.some(function (t) { return t.id === d.template; })) S.template = d.template;
    S.works = (d.items || []).map(function (it) {
      var w = newWork({ title: it.title, creator: it.creator, year: it.year, medium: it.medium, reason: it.reason, note: it.note, layout: it.layout || 'auto', featured: it.featured, cover: it.cover, art: it.art, scenes: it.scenes });
      w.palette = it.palette || null; return w;
    });
    S.sel = 'cover'; S.plan = []; S.kinds = null;
  }

  /* ---------- boot ---------- */
  $('#seg').addEventListener('click', function (e) { var b = e.target.closest('button[data-mode]'); if (!b) return; S.device = b.getAttribute('data-mode'); renderBar(); fitFrame(); setTimeout(function () { goto(selIndex()); }, 120); });
  window.addEventListener('resize', fitFrame);
  if (window.ResizeObserver) new ResizeObserver(fitFrame).observe($('#stage'));
  try { var sv = localStorage.getItem(KEY); if (sv && !/[?&]fresh=1/.test(location.search)) { var dd = JSON.parse(sv); if (dd && dd.items && dd.items.length) load(dd); } } catch (err) { }
  renderRail(); renderInsp(); renderBar(); fitFrame(); loadFrame();
})();
</script>
</body>
</html>
