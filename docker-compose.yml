# Local PostgreSQL for development. `docker compose up -d`, then `npm run db:setup`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lecta
      POSTGRES_PASSWORD: lecta
      POSTGRES_DB: lecta
    ports:
      - "5432:5432"
    volumes:
      - lecta-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecta -d lecta"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  lecta-pg:
