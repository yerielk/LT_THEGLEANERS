name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:          # Actions 탭에서 수동 실행도 가능

concurrency:                  # 배포가 겹치지 않게 하나씩
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy ubuntu@"$HOST" 'bash -s' < deploy/remote-deploy.sh
      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ secrets.DEPLOY_DOMAIN }}/api/health"
