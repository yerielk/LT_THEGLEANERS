# Single-server deployment: Caddy (HTTPS) → web + MCP, with PostgreSQL. See docs/deploy.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: lecta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecta -d lecta"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: ${LECTA_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgres://lecta:${POSTGRES_PASSWORD}@postgres:5432/lecta
      LECTA_MCP_URL: http://mcp:3333/mcp
    depends_on:
      postgres: { condition: service_healthy }

  mcp:
    build: { context: ., target: mcp }
    restart: unless-stopped
    env_file: ${LECTA_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgres://lecta:${POSTGRES_PASSWORD}@postgres:5432/lecta
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, mcp]

volumes:
  pgdata:
  caddy-data:
